{% extends "base.html" %}
{% block title %}Offline · Bunkr{% endblock %}

{% block content %}
<div class="card empty" style="max-width:520px;margin:var(--sp-7) auto">
  <div class="empty__icon">📡</div>
  <h2>No connection</h2>
  <p class="text-muted" style="margin:0 auto var(--sp-5);max-width:380px">
    Bunkr deliberately keeps nothing on your phone — showing you yesterday's
    numbers is exactly how a "safe to bunk" verdict goes wrong. Reconnect and
    everything's here.
  </p>
  <button class="btn btn--primary btn--lg" onclick="window.location.reload()">Try again</button>
</div>
{% endblock %}
