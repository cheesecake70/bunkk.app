{% extends "base.html" %}
{% block title %}Forgot password · Bunkr{% endblock %}

{% block content %}
<div class="wrap--narrow" style="margin:0 auto">
  <div style="text-align:center;margin-bottom:var(--sp-6)">
    <span class="nav__logo" style="font-size:var(--text-2xl)">BUNKR</span>
  </div>

  <form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3>Forgot your password?</h3>
    <p class="text-muted" style="font-size:var(--text-sm);margin-top:0">
      Type the email you signed up with and we'll send you a link to choose a new
      password. The link works for an hour, once.
    </p>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" name="email" type="email" value="{{ email }}"
             autocomplete="email" required autofocus>
    </div>
    <button class="btn btn--primary btn--lg" type="submit" style="width:100%;justify-content:center">Send me a link</button>
  </form>

  <p class="text-muted" style="text-align:center;margin-top:var(--sp-5);font-size:var(--text-sm)">
    Remembered it? <a href="{{ url_for('auth.login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
