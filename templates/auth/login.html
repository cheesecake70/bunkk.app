{% extends "base.html" %}
{% block title %}Sign in · Bunkmate{% endblock %}

{% block content %}
<div class="wrap--narrow" style="margin:0 auto">
  <div style="text-align:center;margin-bottom:var(--sp-6)">
    <span class="nav__logo" style="font-size:var(--text-2xl)">BUNKMATE</span>
    <p class="text-muted" style="margin-top:var(--sp-4)">The bunk budget manager.</p>
  </div>

  <form method="post" class="card">
    <h3>Sign in</h3>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" name="email" type="email" value="{{ email }}" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input class="input {% if errors.password %}is-error{% endif %}"
             id="password" name="password" type="password" required>
      {% if errors.password %}<div class="field__error">{{ errors.password }}</div>{% endif %}
    </div>
    <button class="btn btn--primary btn--lg" type="submit" style="width:100%;justify-content:center">Sign in</button>
  </form>

  <p class="text-muted" style="text-align:center;margin-top:var(--sp-5);font-size:var(--text-sm)">
    No account? <a href="{{ url_for('auth.register') }}">Create one</a>
  </p>
</div>
{% endblock %}
