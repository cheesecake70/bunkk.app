{% extends "base.html" %}
{% block title %}Registration closed · Bunkmate{% endblock %}

{% block content %}
<div class="wrap--narrow" style="margin:0 auto">
  <div class="card empty">
    <div class="empty__icon">🔒</div>
    <h2>Not taking new accounts</h2>
    <p class="text-muted" style="margin:0 auto var(--sp-5);max-width:340px">
      This Bunkmate is private. If you know whoever runs it, ask them for an
      invite.
    </p>
    <a class="btn btn--primary" href="{{ url_for('auth.login') }}">Sign in instead</a>
  </div>
</div>
{% endblock %}
