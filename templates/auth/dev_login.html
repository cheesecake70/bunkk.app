{% extends "base.html" %}
{% block title %}Dev sign-in · Bunkr{% endblock %}
{% block content %}
<div class="wrap--narrow" style="margin:0 auto">
  <form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h3>Development sign-in</h3>
    <p class="text-muted" style="font-size:var(--text-sm);margin-top:0">
      No Google involved. This page only exists with <code>BUNKR_DEV_LOGIN=1</code> in debug mode.
    </p>
    <div class="field">
      <label for="email">Email</label>
      <input class="input" id="email" name="email" type="email" required autofocus>
    </div>
    <button class="btn btn--primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
